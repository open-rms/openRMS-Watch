[package]
name = "openrms-watch-desktop"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/open-rms/openRMS-Watch"

[dependencies]
dirs = "7.0.0"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
toml = "1.2.3"
ureq = { version = "2", features = ["json"] }

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }
